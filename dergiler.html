<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aerodinamik | Dergiler</title>
  <style>
    :root {
      --bg: #0b1224;
      --panel: #131f3c;
      --panel2: #1a2d56;
      --text: #eef6ff;
      --muted: #bcd2ee;
      --border: rgba(255, 255, 255, 0.16);
      --accent: #8ad8ff;
      --ok: #61e3b6;
      --danger: #ff8f8f;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      background: linear-gradient(170deg, #0b1224, #102449 60%, #0b1224);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
    }

    .topbar {
      border-bottom: 1px solid var(--border);
      background: rgba(7, 16, 36, 0.85);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(6px);
    }

    .topbar-inner {
      min-height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand { font-weight: 800; letter-spacing: .7px; text-transform: uppercase; }

    .nav { display: flex; gap: 10px; }

    .btn {
      text-decoration: none;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      padding: 9px 13px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    main { padding: 26px 0 40px; }

    .layout {
      display: grid;
      gap: 16px;
      grid-template-columns: 340px 1fr;
      align-items: start;
    }

    .card {
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    h1, h2, h3 { margin: 0 0 10px; }

    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.95rem;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 11px;
      margin-bottom: 10px;
      font: inherit;
      outline: none;
    }

    textarea { min-height: 90px; resize: vertical; }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(138, 216, 255, 0.25);
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .btn-primary {
      background: var(--accent);
      color: #06233f;
      border-color: transparent;
      font-weight: 700;
    }

    .btn-danger {
      background: rgba(255, 143, 143, 0.18);
      border-color: rgba(255, 143, 143, 0.55);
      color: #ffe0e0;
    }

    .meta {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .issue {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      min-height: 180px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .badge {
      display: inline-block;
      font-size: .78rem;
      background: var(--ok);
      color: #062a24;
      border-radius: 999px;
      padding: 4px 9px;
      font-weight: 700;
      width: fit-content;
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 18px;
      color: var(--muted);
      text-align: center;
      grid-column: 1 / -1;
    }

    .small { color: var(--muted); font-size: .85rem; }

    @media (max-width: 920px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">Aerodinamik</div>
      <nav class="nav" aria-label="Ana menü">
        <a class="btn" href="index.html">Ana Sayfa</a>
        <a class="btn" href="dergiler.html">Dergiler</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Dergilerim</h1>
    <p class="subtitle">Bu bölümde istediğin zaman yeni dergi ekleyebilirsin. Eklenenler tarayıcıda kaydedilir (localStorage).</p>

    <div class="layout">
      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">Yeni Dergi Ekle</h2>

        <label for="title">Dergi adı</label>
        <input id="title" type="text" placeholder="Örn: Aerodinamik Sayı 05" />

        <label for="issue">Sayı</label>
        <input id="issue" type="text" placeholder="Örn: Mayıs 2026" />

        <label for="summary">Kısa tanıtım</label>
        <textarea id="summary" placeholder="Bu sayıda neler var?"></textarea>

        <div class="actions">
          <button id="addBtn" class="btn btn-primary" type="button">Dergi Ekle</button>
          <button id="clearBtn" class="btn btn-danger" type="button">Hepsini Temizle</button>
        </div>
        <p class="small">Not: Veriler sadece bu tarayıcıda saklanır.</p>
      </section>

      <section class="card" aria-labelledby="list-title">
        <h2 id="list-title">Dergi Listesi</h2>
        <div id="info" class="meta">0 dergi var</div>
        <div id="list" class="grid"></div>
      </section>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "aerodinamik-dergiler";

    const titleInput = document.getElementById("title");
    const issueInput = document.getElementById("issue");
    const summaryInput = document.getElementById("summary");
    const addBtn = document.getElementById("addBtn");
    const clearBtn = document.getElementById("clearBtn");
    const listEl = document.getElementById("list");
    const infoEl = document.getElementById("info");

    const defaultItems = [
      {
        title: "Aerodinamik",
        issue: "Sayı 01",
        summary: "Açılış sayısı: yazılar, denemeler ve özel dosya.",
      }
    ];

    function getItems() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultItems;
      try {
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : defaultItems;
      } catch {
        return defaultItems;
      }
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function render() {
      const items = getItems();
      infoEl.textContent = `${items.length} dergi var`;
      listEl.innerHTML = "";

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Henüz dergi yok. Soldan ilk dergini ekleyebilirsin.";
        listEl.appendChild(empty);
        return;
      }

      items.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = "issue";
        card.innerHTML = `
          <span class="badge">${item.issue}</span>
          <h3>${item.title}</h3>
          <p class="subtitle">${item.summary}</p>
          <button class="btn" data-index="${index}" type="button">Sil</button>
        `;
        listEl.appendChild(card);
      });

      listEl.querySelectorAll("button[data-index]").forEach((button) => {
        button.addEventListener("click", () => {
          const itemsNow = getItems();
          itemsNow.splice(Number(button.dataset.index), 1);
          saveItems(itemsNow);
          render();
        });
      });
    }

    addBtn.addEventListener("click", () => {
      const title = titleInput.value.trim();
      const issue = issueInput.value.trim();
      const summary = summaryInput.value.trim();

      if (!title || !issue || !summary) {
        alert("Lütfen tüm alanları doldur.");
        return;
      }

      const items = getItems();
      items.unshift({ title, issue, summary });
      saveItems(items);

      titleInput.value = "";
      issueInput.value = "";
      summaryInput.value = "";
      render();
    });

    clearBtn.addEventListener("click", () => {
      if (!confirm("Tüm dergileri silmek istediğine emin misin?")) return;
      saveItems([]);
      render();
    });

    render();
  </script>
</body>
</html>
