<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aerodinamik | Ana Sayfa</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1d4ed8;
      --bg3: #0ea5e9;
      --text: #f8fbff;
      --muted: #d4e8ff;
      --card: rgba(5, 15, 40, 0.45);
      --border: rgba(255, 255, 255, 0.18);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow-x: hidden;
      background: linear-gradient(120deg, var(--bg1), var(--bg2), var(--bg3), var(--bg1));
      background-size: 300% 300%;
      animation: flow 14s ease infinite;
    }

    @keyframes flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(6px);
      background: rgba(2, 8, 24, 0.35);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      min-height: 72px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .brand {
      font-size: clamp(1.2rem, 2vw, 1.6rem);
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 600;
      transition: transform .2s ease, background .2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.18);
    }

    main {
      min-height: calc(100vh - 72px);
      display: grid;
      place-items: center;
      padding: 34px 0 56px;
    }

    .hero {
      width: min(860px, 100%);
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 24px;
      padding: clamp(20px, 4vw, 44px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5.4vw, 4rem);
      line-height: 1.06;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.65;
      font-size: clamp(1rem, 1.8vw, 1.15rem);
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-solid {
      background: #f8fbff;
      color: #092447;
      border-color: transparent;
    }

    .btn-solid:hover {
      background: #d9efff;
    }

    @media (max-width: 720px) {
      .topbar-inner { padding: 10px 0; }
      .nav { justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">Aerodinamik</div>
      <nav class="nav" aria-label="Ana menü">
        <a class="btn" href="index.html">Ana Sayfa</a>
        <a class="btn" href="dergiler.html">Dergiler</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title">Aerodinamik</h1>
      <p>
        Dergimin resmi web alanına hoş geldin. Bu başlangıç sayfasından diğer bölümlere geçebilir,
        içerikleri keşfedebilirsin. Üst menüdeki butonlarla dergi sayfasına tek tıkla ulaşabilirsin.
      </p>
      <div class="hero-actions">
        <a class="btn btn-solid" href="dergiler.html">Dergileri Gör</a>
        <a class="btn" href="#">Yakında: Hakkımızda</a>
      </div>
    </section>
  </main>
</body>
</html>
